/* ---------- UASA ENGINE (both subjects) ---------- */
function parseFrac(s){s=String(s).trim().replace(/\s+/g,' ');let m;
  if((m=s.match(/^(\d+) (\d+)\/(\d+)$/)))return +m[1]+ +m[2]/ +m[3];
  if((m=s.match(/^(\d+)\/(\d+)$/)))return +m[1]/ +m[2];
  return parseNum(s)}
function parseTime(s){const m=String(s).toLowerCase().replace(/\s/g,'').match(/^(\d{1,2})[:.](\d{2})([ap])\.?m?\.?$/);if(!m)return null;let h=+m[1]%12;if(m[3]==='p')h+=12;return h*60+ +m[2]}
const normText=s=>String(s).toLowerCase().replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
const hasVal=v=>Array.isArray(v)?v.some(x=>x!==''&&x!=null):v!=null&&String(v).trim()!=='';
function partRight(p,raw){
  if(!hasVal(raw))return false;
  if(p.type==='num'){const n=parseNum(raw);return n!==null&&Math.abs(n-p.a)<1e-6}
  if(p.type==='frac'){const n=parseFrac(raw);return n!==null&&Math.abs(n-p.a)<1e-9}
  if(p.type==='text')return p.acc.map(normText).includes(normText(raw));
  if(p.type==='ratio'){const n=(String(raw).match(/\d+(\.\d+)?/g)||[]).map(Number);return n.length===2&&n[0]===p.a[0]&&n[1]===p.a[1]}
  if(p.type==='time')return parseTime(raw)===p.a;
  if(p.type==='mcq')return +raw===p.a;
  if(p.type==='multi')return p.items.every((it,j)=>raw[j]!==''&&raw[j]!=null&&+raw[j]===it.a);
  return false;
}
function itemsRight(p,raw){return p.items.filter((it,j)=>raw&&raw[j]!==''&&raw[j]!=null&&+raw[j]===it.a).length}
function partScore(p,raw){
  if(p.type==='multi'){const c=itemsRight(p,raw),n=p.items.length;return c===n?p.marks:Math.floor(c/n*p.marks)}
  return partRight(p,raw)?p.marks:0;
}
const itemOpts=(p,it)=>it.opts||p.opts;
const optTxt=(p,k)=>p.opts[k].length<=2?p.opts[k]:'ABCD'[k]+'. '+p.opts[k];
function partAnswer(p){
  if(p.type==='num')return fmtNum(p,p.a);
  if(p.type==='frac')return p.disp;
  if(p.type==='text')return p.acc[0];
  if(p.type==='ratio')return p.a[0]+' : '+p.a[1];
  if(p.type==='time'){const h=Math.floor(p.a/60),m=p.a%60;return (h%12||12)+':'+String(m).padStart(2,'0')+(h<12?' a.m.':' p.m.')}
  if(p.type==='mcq')return optTxt(p,p.a);
  if(p.type==='multi')return p.items.map(it=>(it.q.match(/^\([ivx]+\)/)||[it.q])[0]+' '+itemOpts(p,it)[it.a]).join(' · ');
}
const HINT={num:'Numbers only',frac:'e.g. 1 3/8 or 11/8',text:'Type the answer in words',ratio:'e.g. 2 : 3',time:'e.g. 8:30 a.m.'};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function partInput(q,p,i,v){
  const id=`ua-${q.id}-${i}`;
  if(p.type==='mcq')return `<div class="opts" role="radiogroup">${p.opts.map((o,k)=>`<label class="opt ropt"><input type="radio" name="${id}" value="${k}" ${v!=null&&v!==''&&+v===k?'checked':''}><span class="L">${'ABCD'[k]}</span><span>${o}</span></label>`).join('')}</div>`;
  if(p.type==='multi')return `<div class="mrows">${p.items.map((it,j)=>`<div class="mrow"><span class="mq">${it.q}</span><select id="${id}-${j}" aria-label="${esc(it.q)}"><option value="">Choose…</option>${itemOpts(p,it).map((o,k)=>`<option value="${k}" ${v&&v[j]!==''&&v[j]!=null&&+v[j]===k?'selected':''}>${o}</option>`).join('')}</select></div>`).join('')}</div>`;
  return `<div class="ansbox">${p.pre?`<span>${p.pre}</span>`:''}<input id="${id}" inputmode="${p.type==='text'||p.type==='time'?'text':'decimal'}" autocomplete="off" placeholder="${HINT[p.type]}" value="${v!=null&&!Array.isArray(v)?esc(v):''}">${p.unit?`<span>${p.unit}</span>`:''}</div>`;
}
function uasaQHTML(q,label,vals){
  const solo=q.parts.length===1&&!q.parts[0].q;
  return `<div class="ua-head"><span class="eyebrow">Section ${q.sec} · Question ${label} · ${topic(q.t).name}</span><span class="marks num">[${q.marks} mark${q.marks>1?'s':''}]</span></div>
  <div class="q-text">${q.q}</div>${figFor(q)}
  <div class="ua-parts">${q.parts.map((p,i)=>`<div class="ua-part">${p.q?`<p class="ua-pq"><b>${p.label}</b> ${p.q} <span class="marks num">[${p.marks}]</span></p>`:''}
    ${p.type==='mcq'||p.type==='multi'||p.q||solo?'':`<span class="ua-lbl">${p.label||'Answer'} <span class="marks num">[${p.marks}]</span></span>`}
    ${partInput(q,p,i,vals&&vals[i])}<div class="ua-fb" id="uafb-${q.id}-${i}"></div></div>`).join('')}</div>`;
}
function collect(root,q){return q.parts.map((p,i)=>{const id=`ua-${q.id}-${i}`;
  if(p.type==='mcq'){const c=root.querySelector(`input[name="${id}"]:checked`);return c?c.value:''}
  if(p.type==='multi')return p.items.map((_,j)=>{const s=root.querySelector(`#${id}-${j}`);return s?s.value:''});
  const inp=root.querySelector('#'+id);return inp?inp.value:''})}
function lockAll(root){root.querySelectorAll('input,select').forEach(x=>x.disabled=true)}
function partFeedback(q,p,raw){
  const got=partScore(p,raw),ok=got===p.marks,blank=!hasVal(raw);
  let yours='';
  if(p.type==='multi')yours=`<ul class="mres">${p.items.map((it,j)=>{const rv=raw?raw[j]:'',g=rv!==''&&rv!=null?itemOpts(p,it)[+rv]:'No answer',r=rv!==''&&rv!=null&&+rv===it.a;return `<li class="${r?'y':'n'}"><span>${r?'✓':'✗'}</span> ${it.q} <b>${r?g:`${g} → ${itemOpts(p,it)[it.a]}`}</b></li>`}).join('')}</ul>`;
  else if(!ok)yours=`<p>Your answer: <b class="num">${blank?'No answer':p.type==='mcq'?optTxt(p,+raw):esc(raw)}</b></p><p>Correct answer: <b class="num">${partAnswer(p)}</b></p>`;
  else yours=`<p>Answer: <b class="num">${partAnswer(p)}</b></p>`;
  const why=!ok&&p.type==='mcq'&&p.why&&p.why[raw]?`<p>${p.why[raw]}</p>`:'';
  return `<div class="fb ${ok?'ok':got?'part':'no'}"><h3>${ok?pick(praise):got?'Partly right.':pick(encourage)} <span class="marks num">${got}/${p.marks}</span></h3>
  ${yours}${why}<p style="margin-top:8px"><b>${SUBJECTS[q.s].workLabel}</b></p><ol>${p.work.map(s=>`<li>${s}</li>`).join('')}</ol>${!ok&&p.tip?`<div class="tip"><b>Common mistake:</b> ${p.tip}</div>`:''}</div>`;
}
function shuffledCopy(q){
  return {...q,parts:q.parts.map(p=>{if(p.type!=='mcq'||p.fixed)return p;const ord=shuffle(p.opts.map((_,k)=>k));
    const why={};if(p.why)ord.forEach((o,k)=>{if(p.why[o])why[k]=p.why[o]});
    return {...p,opts:ord.map(k=>p.opts[k]),a:ord.indexOf(p.a),why}})};
}

/* science Section A pool from the multiple-choice bank */
function sciA(){return SCI_Q.filter(q=>q.type==='mcq').map(q=>({id:q.id,t:q.t,s:'science',sec:'A',marks:1,q:q.q,fig:q.fig,parts:[{type:'mcq',opts:q.opts,a:q.a,why:q.why,work:q.work,marks:1,fixed:q.fixed}]}))}
function spreadPick(pool,n,topicList){
  const ord=q=>topicList.findIndex(t=>t.id===q.t);const by={};shuffle(pool).forEach(q=>(by[q.t]=by[q.t]||[]).push(q));
  const keys=shuffle(Object.keys(by)),out=[];let r=0;
  while(out.length<n&&keys.some(k=>by[k].length>r)){for(const k of keys){if(out.length<n&&by[k][r])out.push(by[k][r])}r++}
  return out.sort((a,b)=>ord(a)-ord(b));
}
function pickSectionA(){const by=m=>UASA_A.filter(q=>q.marks===m);return [...spreadPick(by(1),2,MATHS_TOPICS),...spreadPick(by(2),9,MATHS_TOPICS),...spreadPick(by(3),2,MATHS_TOPICS)]}

const PAPERS={
  maths:{key:'maths-uasa',title:'UASA-format Maths paper',code:'Matematik (015)',dur:75*60,
    rows:[['A','13 questions (1–3 marks each)',26],['B','2 structured questions',24]],
    rules:['Answer every question. Write the answer only; there is no multiple choice.','No calculator. Do your working on paper.'],
    note:'Each answer box gets full marks when the final answer is correct. In the real exam, a teacher may also give marks for correct working.',
    build:()=>[...pickSectionA(),...shuffle(UASA_B).slice(0,2)]},
  science:{key:'science-uasa',title:'UASA-format Science paper',code:'Sains (018)',dur:75*60,
    rows:[['A','10 multiple-choice questions (1 mark each)',10],['B','2 questions (4 marks each)',8],['C','4 questions (6, 6, 10, 10 marks)',32]],
    rules:['Answer every question.','Section B and C use True/False, matching and choose-the-answer tasks.'],
    note:'In the real exam, Section C also asks you to write some answers in your own words. Here you choose from options, so practise writing hypotheses and inferences on paper too.',
    build:()=>[...spreadPick(sciA(),10,SCI_TOPICS),...shuffle(SCI_B).slice(0,2),...shuffle(SCI_C.filter(q=>q.marks===6)).slice(0,2),...shuffle(SCI_C.filter(q=>q.marks===10)).slice(0,2)]}
};
function labelsFor(list){const c={};return list.map(q=>{c[q.sec]=(c[q.sec]||0)+1;return q.sec==='A'?String(c.A):q.sec+c[q.sec]})}

/* --- section practice --- */
let uap=null;
function practiceSet(kind){
  if(SUBJ==='maths')return kind==='B'?shuffle(UASA_B).slice(0,1):pickSectionA();
  if(kind==='A')return spreadPick(sciA(),10,SCI_TOPICS);
  if(kind==='B')return shuffle(SCI_B).slice(0,2);
  return shuffle(SCI_C).slice(0,1);
}
function runUasaPractice(kind){
  const list=practiceSet(kind).map(shuffledCopy);
  uap={kind,list,labels:labelsFor(list),i:0,got:0,max:list.reduce((s,q)=>s+q.marks,0)};
  showUasaPractice();
}
function showUasaPractice(){
  const p=uap,q=p.list[p.i];
  app.innerHTML=`<div class="qhead"><span class="t">${SUBJECTS[SUBJ].short} · Section ${p.kind} practice</span><span class="muted num small">Question ${p.i+1} of ${p.list.length} · ${p.got} marks</span></div>
  <div class="pbar"><i style="width:${p.i/p.list.length*100}%"></i></div>
  <form class="sheet" id="uaf">${uasaQHTML(q,p.labels[p.i])}
  <div class="qnav"><button class="btn" type="button" id="quit">Stop and see score</button><span style="display:flex;gap:8px"><button class="btn primary" type="submit" id="chk">Check answer${q.parts.length>1?'s':''}</button><button class="btn primary" type="button" id="next" hidden>${p.i===p.list.length-1?'See my score':'Next question →'}</button></span></div></form>`;
  const f=app.querySelector('#uaf');
  f.onsubmit=e=>{e.preventDefault();const raw=collect(f,q);let m=0;
    q.parts.forEach((pt,i)=>{m+=partScore(pt,raw[i]);app.querySelector(`#uafb-${q.id}-${i}`).innerHTML=partFeedback(q,pt,raw[i])});
    lockAll(f);markOpts(f,q,raw);p.got+=m;store.q[q.id]=m===q.marks?1:0;save();
    app.querySelector('#chk').hidden=true;const n=app.querySelector('#next');n.hidden=false;n.focus();};
  app.querySelector('#next').onclick=()=>{p.i++;p.i<p.list.length?showUasaPractice():uasaPracticeDone()};
  app.querySelector('#quit').onclick=uasaPracticeDone;
}
function markOpts(root,q,raw){q.parts.forEach((p,i)=>{if(p.type!=='mcq')return;root.querySelectorAll(`input[name="ua-${q.id}-${i}"]`).forEach(inp=>{const k=+inp.value,l=inp.closest('.opt');if(k===p.a)l.classList.add('right');else if(raw[i]!==''&&k===+raw[i])l.classList.add('wrong')})})}
function uasaPracticeDone(){
  const p=uap,pct=p.max?Math.round(p.got/p.max*100):0;
  app.innerHTML=`<div class="sheet" style="margin-top:32px"><div class="result-top"><div class="ring num" style="font-size:1.6rem">${p.got}/${p.max}</div><div><h2>Section ${p.kind} practice</h2><p>${pct>=80?'Excellent work!':pct>=50?'Good effort. Check the working for the ones you missed.':'Keep practising. Read each explanation carefully.'}</p></div></div>
  <div class="qnav"><button class="btn" id="back">Back to practice</button><button class="btn primary" id="again">Try another set</button></div></div>`;
  app.querySelector('#back').onclick=()=>go('practice');app.querySelector('#again').onclick=()=>go('uasaprac',p.kind);
}

/* --- full paper --- */
let ua=null;
function viewUasa(){
  if(ua&&!ua.done&&ua.subj===SUBJ){go('uasarun');return}
  const P=PAPERS[SUBJ],hist=store.mocks.filter(m=>m.subj===P.key).slice(-5).reverse();
  app.innerHTML=`<div class="sheet" style="margin-top:32px">
    <span class="eyebrow">Exam practice · ${P.code}</span>
    <h2 style="font-size:1.8rem;margin:6px 0 10px">${P.title}</h2>
    <div class="tbl" style="overflow-x:auto"><table class="data-tbl"><tr><th>Section</th><th>Questions</th><th>Marks</th></tr>
      ${P.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="num">${r[2]}</td></tr>`).join('')}<tr><th>Total</th><td>1 hour 15 minutes</td><th class="num">50</th></tr></table></div>
    <ul style="margin:14px 0 16px;padding-left:1.2em">${P.rules.map(r=>`<li>${r}</li>`).join('')}<li>The paper is handed in automatically when time runs out. Marks and explanations appear afterwards.</li></ul>
    <p class="muted small">${P.note}</p>
    <button class="btn hi" id="start">Start the clock</button></div>
  ${hist.length?`<div class="section-h"><h2>Recent attempts</h2></div><div class="sheet topics">${hist.map(h=>`<div class="trow" style="grid-template-columns:minmax(0,1fr) auto"><div><div class="tname num">${h.score} / ${h.total} marks</div><div class="tmeta">${h.date}</div></div><div class="num muted small">${h.time}</div></div>`).join('')}</div>`:''}`;
  app.querySelector('#start').onclick=()=>{const list=P.build().map(shuffledCopy);
    ua={subj:SUBJ,dur:P.dur,key:P.key,list,labels:labelsFor(list),vals:list.map(()=>[]),i:0,left:P.dur,start:Date.now(),done:false};go('uasarun')};
}
function runUasa(){
  if(!timerId){timerId=setInterval(()=>{ua.left=Math.max(0,ua.dur-Math.floor((Date.now()-ua.start)/1000));
    const el=document.getElementById('clk');if(el){el.textContent=clock(ua.left);el.classList.toggle('low',ua.left<=300)}
    if(ua.left<=0)submitUasa()},1000)}
  const u=ua,q=u.list[u.i],answered=k=>u.vals[k].some(hasVal);
  app.innerHTML=`<div class="qhead"><span class="t">UASA ${SUBJECTS[u.subj].short} · Section ${q.sec}</span><span class="timer num ${u.left<=300?'low':''}" id="clk">${clock(u.left)}</span></div>
  <div class="pbar"><i style="width:${u.list.filter((_,k)=>answered(k)).length/u.list.length*100}%"></i></div>
  <div class="sheet" id="uaq">${uasaQHTML(q,u.labels[u.i],u.vals[u.i])}
    <div class="qnav"><button class="btn" id="prev" ${u.i===0?'disabled':''}>← Previous</button>${u.i<u.list.length-1?`<button class="btn primary" id="nxt">Next →</button>`:`<button class="btn hi" id="sub">Hand in paper</button>`}</div>
    <div class="palette" aria-label="Jump to question">${u.list.map((_,k)=>`<button data-j="${k}" class="${answered(k)?'done':''} ${k===u.i?'cur':''}" style="${u.labels[k].length>2?'width:44px':''}">${u.labels[k]}</button>`).join('')}</div>
    <div id="cbox"></div>${u.i<u.list.length-1?`<p style="margin-top:14px"><button class="btn" id="sub2">Hand in paper early</button></p>`:''}</div>`;
  const box=app.querySelector('#uaq');
  const sync=()=>{u.vals[u.i]=collect(box,q);const b=app.querySelector(`[data-j="${u.i}"]`);b&&b.classList.toggle('done',answered(u.i));
    app.querySelector('.pbar i').style.width=u.list.filter((_,k)=>answered(k)).length/u.list.length*100+'%'};
  box.addEventListener('input',sync);box.addEventListener('change',sync);
  box.querySelectorAll('input[type=text],input:not([type])').forEach(inp=>inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const n=app.querySelector('#nxt');n&&n.click()}});
  app.querySelector('#prev').onclick=()=>{u.i--;runUasa()};
  const nx=app.querySelector('#nxt');if(nx)nx.onclick=()=>{u.i++;runUasa()};
  app.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{u.i=+b.dataset.j;runUasa()});
  const ask=()=>{const blank=u.list.filter((_,k)=>!answered(k)).length;
    app.querySelector('#cbox').innerHTML=`<div class="confirm"><span>${blank?`You have <b>${blank}</b> unanswered question${blank>1?'s':''}. `:''}Hand in your paper now?</span><button class="btn primary" id="yes">Yes, hand in</button><button class="btn" id="no">Keep working</button></div>`;
    app.querySelector('#yes').onclick=submitUasa;app.querySelector('#no').onclick=()=>app.querySelector('#cbox').innerHTML=''};
  ['#sub','#sub2'].forEach(s=>{const b=app.querySelector(s);if(b)b.onclick=ask});
}
function submitUasa(){
  if(!ua||ua.done)return;clearInterval(timerId);timerId=null;ua.done=true;
  ua.res=ua.list.map((q,k)=>{const got=q.parts.reduce((s,p,i)=>s+partScore(p,ua.vals[k][i]),0);store.q[q.id]=got===q.marks?1:0;return got});
  ua.score=ua.res.reduce((a,b)=>a+b,0);ua.total=ua.list.reduce((s,q)=>s+q.marks,0);
  const d=new Date();
  store.mocks.push({subj:ua.key,score:ua.score,total:ua.total,date:d.toLocaleDateString('en-MY',{day:'numeric',month:'short',year:'numeric'})+', '+d.toLocaleTimeString('en-MY',{hour:'numeric',minute:'2-digit'}),time:clock(ua.dur-ua.left)+' used'});
  store.mocks=store.mocks.slice(-40);save();go('uasares');
}
function uasaResults(){
  const u=ua,pct=Math.round(u.score/u.total*100);
  const secs=[...new Set(u.list.map(q=>q.sec))].map(s=>{const ks=u.list.map((q,k)=>q.sec===s?k:-1).filter(k=>k>=0);return `Section ${s}: ${ks.reduce((a,k)=>a+u.res[k],0)}/${ks.reduce((a,k)=>a+u.list[k].marks,0)}`}).join(' · ');
  const msg=pct>=80?'Excellent result! You are well prepared for UASA.':pct>=60?'Good work. Look at the questions you missed and revise those topics.':pct>=40?'A fair start. Study the explanations below, then try another paper.':'Don’t give up. Work through the notes topic by topic, then try again.';
  app.innerHTML=`<div class="sheet" style="margin-top:32px">
    <div class="result-top"><div class="ring num" style="font-size:1.7rem">${u.score}/${u.total}</div><div><h2>${pct}%</h2><p>${msg}</p><p class="small num">${secs} · Time used: ${clock(u.dur-u.left)}</p></div></div>
    <div class="tbl" style="overflow-x:auto;margin-top:16px"><table class="data-tbl score-tbl"><tr><th>Question</th>${u.labels.map(l=>`<th>${l}</th>`).join('')}</tr><tr><td>Marks</td>${u.res.map((r,k)=>`<td class="num ${r===u.list[k].marks?'full':r?'part':'zero'}">${r}/${u.list[k].marks}</td>`).join('')}</tr></table></div>
    <div class="qnav"><button class="btn" id="home">Back to home</button><button class="btn hi" id="again">Try a new paper</button></div></div>
  <div class="section-h"><h2>Check your answers</h2><span>Marks and explanations for every question</span></div>
  <div class="review">${u.list.map((q,k)=>`<div class="sheet" data-k="${k}">${uasaQHTML(q,u.labels[k],u.vals[k])}</div>`).join('')}</div>`;
  app.querySelectorAll('.review [data-k]').forEach(el=>{const k=+el.dataset.k,q=u.list[k];lockAll(el);markOpts(el,q,u.vals[k]);
    q.parts.forEach((p,i)=>{const fb=el.querySelector(`#uafb-${q.id}-${i}`);if(fb)fb.innerHTML=partFeedback(q,p,u.vals[k][i])})});
  app.querySelector('#home').onclick=()=>{ua=null;go('home')};app.querySelector('#again').onclick=()=>{ua=null;go('mock')};
}

UASA_A.forEach(q=>q.sec='A');UASA_B.forEach(q=>q.sec='B');

document.querySelectorAll('[data-subj]').forEach(b=>b.onclick=()=>{if(b.dataset.subj!==SUBJ){setSubject(b.dataset.subj);go('home')}});
setSubject(SUBJECTS[store.subj]?store.subj:'maths');
go('home');
</script>
